{% extends "base.html" %}

{% block title %}{{ section.title }} · {{ config.title }}{% endblock %}

{% block content %}
<div class="page">
  <h1 class="page-title">{{ section.title }}</h1>
  {{ section.content | safe }}
  {% for p in section.pages %}
  <h2><a href="{{ p.permalink }}">{{ p.title }}</a></h2>
  {% if p.description %}<p>{{ p.description }}</p>{% endif %}
  {% endfor %}
</div>
{% endblock %}
